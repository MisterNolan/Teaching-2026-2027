 r4:{sit:YEAR,ch:["Keep to the routine.","Send money home.","Think about leaving the mill."],

 r5:{sit:HOPE,ch:["To stay on in the mill.","To marry and have a farm of your own.","To join other workers in asking for shorter hours."],
  out:["You are still in the mill. The machines run faster and you now tend more looms for the same pay.","You have left the mill, married, and returned to a farm.","You are active in the Lowell Female Labor Reform Association, which mill workers founded in the winter of 1844 to 1845."],
  fixed1:"You are back at home on the family farm after being dismissed.",
  fixed9:"You are married and living on a farm in Ohio."}
},
{ // 10
 name:"Newly arrived immigrant family, northern city",
 intro:"Your family has just arrived in a northern city from Europe, with little money.",
 note:NOTE_OTHER,
 r2:{sit:"You need work.",ch:["Take the first job offered.","Go where a contractor is hiring labourers.","Look for work near the docks or the mills."],
  out:["You work as a labourer digging canals or laying railway track, moving with each contract.","You work on the docks, unloading cotton and other goods from the ships.","You work in a mill as the mill owners look for cheaper labour."]},
 r3:{sit:"Work and rents are both changing.",ch:["Share a room with other families to save on rent.","Look for work in another city.","Keep your job and spend as little as you can."],
  out:["Building work is plentiful during the boom, and wages are better than at home.","The Panic of 1837 brings unemployment and hunger to northern cities.","Rents in the crowded districts go up and several families share a room."]},
 r4:{sit:YEAR,ch:["Stay in the same job.","Look for a steadier employer.","Join a mutual aid society or a church group."],
  out:["Major setback: you lose your job, fall ill and cannot pay the rent.","Minor setback: your wages are cut or paid late.","Nothing changes. You work, eat and sleep.","Minor improvement: you find steady work with a contractor who pays on time.","Major improvement: you save enough to open a small shop or take up a farm in the Midwest.","Unusual event: you join a workers' protest over wages or hours."]},
 r5:{sit:HOPE,ch:["A steady job.","A shop or a farm of your own.","Schooling for your children."],
  out:["You are still in the same city, doing the same work.","You have moved to a mill town for steadier work.","You run a small shop and your children are in school."],
  fixed1:"You are in the same city without steady work, and you are getting by on odd jobs and help from neighbours.",
  fixed9:"You run a small shop or have taken up a farm in the Midwest.",
  cond:function(b,s){return (b===2&&!(s.r4===7||s.r4===8))?0:b;}}
},
{ // 11
 name:"Northern mill owner or merchant family",
 intro:"Your family owns a textile mill or a trading business in the North.",
 note:NOTE_OTHER,
 r2:{sit:"The family business needs direction.",ch:["Buy raw cotton directly from southern factors.","Spend time on wages, hours and the boarding houses.","Invest the profits in other businesses."],
  out:["The mill buys raw cotton from southern factors and ships it north by sea.","The family sets wages, hours and the rules of the boarding houses.","The family invests its profits in canals, railways and banks."]},
 r3:{sit:"Cotton prices and credit are both moving.",ch:["Expand the mill.","Hold cash.","Extend credit to customers."],
  out:["Demand for cloth rises and the family opens a second mill.","The Panic of 1837 hits. Banking and insurance shares fall sharply, and some customers go bankrupt.","The mill's profits drop and the family cuts wages and speeds up the machines."]},
 r4:{sit:YEAR,ch:["Keep production steady.","Buy new machinery.","Cut wages if profits fall."],
  out:["Major setback: a bank the family relies on fails and the mill closes.","Minor setback: a strike in the mill cuts output for several weeks.","Nothing changes. Cotton arrives, cloth leaves.","Minor improvement: a new machine lets the mill make more cloth with the same workers.","Major improvement: the family opens a new mill town on a river and builds boarding houses for a new workforce.","Unusual event: a southern planter who borrowed money from your bank defaults, and the bank forecloses on a plantation."]},
 r5:{sit:HOPE,ch:["To keep the mills running.","To open a new mill.","To move into banking."],
  out:["The family's mills are running at a reduced rate.","The family's position is steady.","The family is among the wealthiest in the state."],
  fixed1:"The mill has closed and the family has lost most of its money.",
  fixed9:"The family is among the wealthiest in the state.",
  cond:function(b,s){return (b===2&&!(s.r3b===0||s.r4===7||s.r4===8))?1:b;}}
},
{ // 12
 name:"Cherokee, Choctaw or Creek family in the Southeast",
 native:true,
 intro:function(n){return "Your family belongs to the "+n+" nation in the Southeast and lives on the nation's own land.";},
 note:NOTE_NATIVE,
 r2:{sit:"Your family has its own farms, council and customs.",ch:["Farm and trade with the white settlers.","Send the children to school.","Take part in the nation's council."],
  out:["Your family farms land that has been in the nation for generations, growing corn and raising livestock, and trades with white settlers.","You go to a mission school. Your nation has its own government, and the Cherokee have their own newspaper and writing system.","Your family runs a mill, a ferry or a store on a road that settlers use."]},
 r3:{sit:"Settlers and the government want your nation's land.",ch:["Stay and farm as usual.","Take part in the nation's debate about what to do.","Write to officials to protest."],
  out:["Settlers move onto your land, driven by the demand for cotton land. The state government does not stop them.","Congress passes the Indian Removal Act in 1830. Your nation splits over whether to sign a treaty or resist.",
   function(n){return n==="Cherokee"?"Your nation goes to the Supreme Court, which rules in Worcester v. Georgia (1832) in its favour. President Jackson refuses to enforce the decision.":"Your nation is pressed to sign a removal treaty under threat of the army.";}]},
 r4:{sit:YEAR,ch:["Wait for news from the council.","Prepare to move if you have to.","Try to protect the farm and the animals."],
  out:["Major setback: soldiers remove your family from home and hold you in a camp before the journey west. Many people died in the camps and on the way.","Minor setback: settlers take your livestock or the harvest.","Nothing changes. Your family waits for news from the council.","Minor improvement: you are allowed to sell your farm and animals before leaving, though settlers have already paid less than they are worth.","Major improvement: your family is among those who avoided removal and stay in the homeland, in a smaller community.",
   function(n){
    if(n==="Choctaw") return "Unusual event: Choctaw leaders sign the Treaty of Dancing Rabbit Creek in September 1830. It is the first removal treaty under the Indian Removal Act, and the nation gives up its land east of the Mississippi.";
    if(n==="Creek") return "Unusual event: Creek leaders sign the Treaty of Cusseta in March 1832. The nation gives up its land east of the Mississippi and families are promised their own plots in Alabama. Settlers and speculators take many of them.";
    return "Unusual event: a small group of leaders signs the Treaty of New Echota in December 1835. Most of the nation says the treaty is not valid, but the government enforces it.";}]},
 r5:{sit:HOPE,ch:["To keep the family together.","To rebuild or protect your home.","To keep the nation's laws and customs."],
  out:["You are in Indian Territory, in what is now Oklahoma, rebuilding houses and farms.","You remained in the homeland, in a smaller community, while most of your nation was removed.",
   function(n){return "Your family lost members on the journey west."+(n==="Cherokee"?" About 4,000 of the roughly 16,000 Cherokee who were removed are estimated to have died.":"");}],
  fixed1:"You are in Indian Territory, in what is now Oklahoma, rebuilding houses and farms. Many people died in the camps and on the journey.",
  fixed9:"You remained in the homeland, in a smaller community, while most of your nation was removed.",
  cond:function(b,s){ if(b===1) return 0; if(b===2&&!(s.r4===7||s.r4===8||s.r4===10)) return 0; return b; }}
}
];

var FRAMING="Each of you gets the life of a real kind of person from the 1830s and 1840s in the United States. Some of these people were enslaved and some were not. The dice follow what was likely at the time, so the lives will not be fair. Nobody wins. You are recording a life the way a historian would. If you are uncomfortable with your character, tell me and I will roll again.";

/* ---------- helpers ---------- */
function d(n){return Math.floor(Math.random()*n)+1;}
function band(n){return Math.ceil(n/2)-1;}
function r4idx(n){return n===1?0:n<=3?1:n<=6?2:n<=8?3:n===9?4:5;}
function charFromD20(n){return n<=4?0:n<=6?1:n===7?2:n===8?3:n===9?4:n<=11?5:n<=13?6:n===14?7:n<=16?8:n===17?9:n===18?10:11;}
function nationFromD6(n){return n<=3?"Cherokee":n<=5?"Choctaw":"Creek";}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function txt(x){return typeof x==="function"?x(S.nation):x;}
function firstSentence(s){var i=s.indexOf(". ");return i>0?s.slice(0,i+1):s;}
function personName(){var c=CHARS[S.ci];return c.native?S.nation+" family in the Southeast":c.name;}

/* ---------- storage ---------- */
var KEY="cottonJourneyLog_v1", memLog=[], storageOK=true;
function loadLog(){try{var v=localStorage.getItem(KEY);return v?JSON.parse(v):[];}catch(e){storageOK=false;return memLog;}}
function saveLog(log){memLog=log;try{localStorage.setItem(KEY,JSON.stringify(log));}catch(e){storageOK=false;}}

/* ---------- state ---------- */
var S={}, screen="home", busy=false, armed=null;
function newStudent(name){S={name:name,ci:null,nation:"",r1:null,rerolled:false,override:false,rounds:{},round:1,choice:null,saved:false};}

function rollCharacter(){
 var n=d(20); S.rerolled=false;
 while(n===20){S.rerolled=true;n=d(20);}
 S.r1=n; S.ci=charFromD20(n);
 S.nation=CHARS[S.ci].native?nationFromD6(d(6)):"";
}

function resolve(round,roll){
 var c=CHARS[S.ci], r=c["r"+round];
 if(round===4) return {text:txt(r.out[r4idx(roll)]),rule:""};
 if(round<4) return {text:txt(r.out[band(roll)]),rule:""};
 var b=band(roll), nb=b;
 if(r.cond) nb=r.cond(b,{r2b:band(S.rounds[2].roll),r3b:band(S.rounds[3].roll),r4:S.rounds[4].roll});
 return {text:txt(r.out[nb]),rule:nb===b?"rolled":"substituted"};
}
function fixedR5(){
 var r=CHARS[S.ci].r5, r4=S.rounds[4].roll;
 if(r4===1&&r.fixed1) return r.fixed1;
 if(r4===9&&r.fixed9) return r.fixed9;
 return null;
}

/* ---------- rendering ---------- */
var app=document.getElementById("app"), roundEl=document.getElementById("round");
function setRound(t){roundEl.innerHTML=t||"";}
function aside(){
 var h='<aside><p class="sc">The Person</p><p class="person">'+esc(personName())+'</p><p class="name">Name: '+esc(S.name)+'</p><div class="journal"><p class="sc">Journal</p>';
 h+='<p><i>I.</i> '+esc(firstSentence(txt(CHARS[S.ci].intro)))+'</p>';
 for(var i=2;i<=5;i++){
  if(S.rounds[i]) h+='<p><i>'+ROMAN[i]+'.</i> '+esc(firstSentence(S.rounds[i].text))+'</p>';
  else h+='<p class="todo"><i>'+ROMAN[i]+'.</i> Not yet written.</p>';
 }
 return h+'</div></aside>';
}
function animate(el,sides,final,done){
 busy=true; var t=0, iv=setInterval(function(){
  el.textContent=d(sides); t++;
  if(t>=14){clearInterval(iv);el.textContent=final;busy=false;done();}
 },70);
}

function render(){
 armed=null;
 if(screen==="home") return home();
 if(screen==="framing") return framing();
 if(screen==="r1") return r1();
 if(screen==="r1result") return r1result();
 if(screen==="choice") return choice();
 if(screen==="roll") return rollScreen();
 if(screen==="result") return result();
 if(screen==="end") return endScreen();
 if(screen==="log") return logScreen();
}

function home(){
 setRound("");
 var log=loadLog();
 app.innerHTML='<div class="centre"><p class="big">Enter the next student\'s name to begin.</p>'
 +'<p style="margin:1rem 0 .5rem"><input type="text" id="nm" maxlength="40" placeholder="Student name" autocomplete="off"></p>'
 +'<p class="note">'+log.length+' of 18 lives recorded on this laptop.'+(storageOK?'':' <span class="warn">This browser is not saving the log. Download the results before closing the page.</span>')+'</p>'
 +'<div class="foot"><button class="btn small" id="fr">Read the opening statement</button><button class="btn" id="go">Begin</button></div>'
 +'<details class="teacher"><summary>Teacher</summary>'
 +'<div class="row"><button class="btn small" id="csv">Download all results (CSV)</button><button class="btn small" id="json">Download all results (JSON)</button><button class="btn small" id="view">View class table</button><button class="btn small" id="clr">Clear the log</button></div>'
 +'<p>To re-roll a character, press <b>Shift + R</b> on the screen that first shows who the student is. The log marks it as an override. Results are stored in this browser on this laptop only, so download them at the end of each lesson.</p></details></div>';
 var nm=document.getElementById("nm"); nm.focus();
 function begin(){var v=nm.value.trim(); if(!v){nm.focus();return;} newStudent(v); screen="r1"; render();}
 document.getElementById("go").onclick=begin;
 nm.onkeydown=function(e){if(e.key==="Enter")begin();};
 document.getElementById("fr").onclick=function(){screen="framing";render();};
 document.getElementById("csv").onclick=downloadCSV;
 document.getElementById("json").onclick=downloadJSON;
 document.getElementById("view").onclick=function(){screen="log";render();};
 var clr=document.getElementById("clr");
 clr.onclick=function(){ if(armed==="clr"){saveLog([]);render();} else {armed="clr";clr.textContent="Click again to delete all results";} };
}

function framing(){
 setRound("");
 app.innerHTML='<div class="centre"><p class="sc">Before the first roll</p><blockquote>'+esc(FRAMING)+'</blockquote><div class="foot"><span></span><button class="btn" id="ok">Continue</button></div></div>';
 document.getElementById("ok").onclick=function(){screen="home";render();};
}

function r1(){
 setRound("Round<br>I of V");
 app.innerHTML='<div class="centre"><p class="sc">Round I. Who you are</p><p class="big">'+esc(S.name)+', the die decides whose life you will record.</p>'
 +'<div class="dierow" style="margin-top:1.4rem"><div class="die" id="die">?</div><p class="note">A twenty-sided die. A 20 is rolled again.</p></div>'
 +'<div class="foot"><span></span><button class="btn" id="roll">Roll the die</button></div></div>';
 var b=document.getElementById("roll"); b.focus();
 b.onclick=function(){ if(busy)return; b.disabled=true; rollCharacter(); animate(document.getElementById("die"),20,S.r1,function(){setTimeout(function(){screen="r1result";render();},500);}); };
}

function r1result(){
 setRound("Round<br>I of V");
 var c=CHARS[S.ci];
 app.innerHTML='<div class="centre"><div class="dierow"><div class="die">'+S.r1+'</div><div><p class="sc">You rolled '+S.r1+(S.rerolled?' (a 20 was rolled again)':'')+'</p><p class="chosen">'+esc(personName())+'</p></div></div>'
 +'<div class="rule"><p class="big">'+esc(txt(c.intro))+'</p></div>'
 +'<div class="foot"><p class="note">'+(S.override?'Re-rolled by the teacher.':'')+'</p><button class="btn" id="next">Go on to Round II</button></div></div>';
 var b=document.getElementById("next"); b.focus();
 b.onclick=function(){S.round=2;S.choice=null;screen="choice";render();};
}

function choice(){
 var n=S.round, r=CHARS[S.ci]["r"+n];
 setRound("Round<br>"+ROMAN[n]+" of V");
 var h=aside()+'<section><p class="sc">Round '+ROMAN[n]+'. '+ROUNDNAME[n]+'</p><p class="big">'+esc(r.sit)+'</p>';
 h+='<p class="ask">'+(n===5?'Choose one.':'What do you do?')+'</p>';
 for(var i=0;i<3;i++) h+='<button class="choice" data-i="'+i+'"><b>'+ROMAN[i+1]+'</b><span>'+esc(r.ch[i])+'</span></button>';
 h+='<div class="foot"><p class="note">Your choices are limited. The dice decide what happens next.</p></div></section>';
 app.innerHTML=h;
 var bs=app.querySelectorAll(".choice");
 for(var j=0;j<bs.length;j++) bs[j].onclick=function(){S.choice=+this.getAttribute("data-i");screen="roll";render();};
}

function rollScreen(){
 var n=S.round, r=CHARS[S.ci]["r"+n], sides=n===4?10:6;
 setRound("Round<br>"+ROMAN[n]+" of V");
 var fixed=n===5?fixedR5():null;
 var h=aside()+'<section><div class="dierow"><div class="die" id="die">'+(fixed?'–':'?')+'</div><div><p class="sc">You chose</p><p class="chosen">'+ROMAN[S.choice+1]+'. '+esc(r.ch[S.choice])+'</p></div></div>';
 if(fixed) h+='<div class="rule"><p class="note">No die this round. What happened in Round IV decides where you are in 1848.</p></div><div class="foot"><span></span><button class="btn" id="roll">See where you are in 1848</button></div></section>';
 else h+='<div class="rule"><p class="note">'+(sides===10?'A ten-sided die.':'A six-sided die.')+'</p></div><div class="foot"><span></span><button class="btn" id="roll">Roll the die</button></div></section>';
 app.innerHTML=h;
 var b=document.getElementById("roll"); b.focus();
 b.onclick=function(){
  if(busy)return; b.disabled=true;
  var ctext=ROMAN[S.choice+1]+". "+r.ch[S.choice];
  if(fixed){S.rounds[5]={choice:ctext,roll:"",text:fixed,rule:"fixed by Round 4"};screen="result";render();return;}
  var roll=d(sides), res=resolve(n,roll);
  animate(document.getElementById("die"),sides,roll,function(){
   S.rounds[n]={choice:ctext,roll:roll,text:res.text,rule:res.rule};
   setTimeout(function(){screen="result";render();},500);
  });
 };
}

function result(){
 var n=S.round, rec=S.rounds[n], c=CHARS[S.ci];
 setRound("Round<br>"+ROMAN[n]+" of V");
 var note=c.note;
 if(n===5&&rec.rule==="fixed by Round 4") note="No die was rolled. What happened in Round IV decided this.";
 if(n===5&&rec.rule==="substituted") note="The die showed "+rec.roll+", but that result does not fit what happened earlier, so the nearest result that fits is recorded.";
 var h=aside()+'<section><div class="dierow"><div class="die">'+(rec.roll===""?'–':rec.roll)+'</div><div><p class="sc">You chose</p><p class="chosen">'+esc(rec.choice)+'</p>'+(rec.roll===""?'':'<p style="margin:.1rem 0 0">You rolled '+rec.roll+'.</p>')+'</div></div>'
 +'<div class="rule"><p class="sc">'+(n===5?'Where you are in 1848':'What happened')+'</p><p class="big">'+esc(rec.text)+'</p></div>'
 +'<div class="foot"><p class="note" style="max-width:24rem">'+esc(note)+'</p><button class="btn" id="next">'+(n<5?'Go on to Round '+ROMAN[n+1]:'Finish the record')+'</button></div></section>';
 app.innerHTML=h;
 var b=document.getElementById("next"); b.focus();
 b.onclick=function(){ if(n<5){S.round=n+1;S.choice=null;screen="choice";} else {saveRecord();screen="end";} render(); };
}

function saveRecord(){
 if(S.saved) return;
 var rec={name:S.name,character:CHARS[S.ci].name,nation:S.nation,r1_roll:S.r1,override:S.override?"yes":"no"};
 for(var i=2;i<=5;i++){var r=S.rounds[i];rec["r"+i+"_choice"]=r.choice;rec["r"+i+"_roll"]=r.roll;rec["r"+i+"_outcome"]=r.text;}
 rec.r5_rule=S.rounds[5].rule; rec.time=new Date().toISOString();
 var log=loadLog(); log.push(rec); saveLog(log); S.saved=true;
}

function endScreen(){
 setRound("");
 var c=CHARS[S.ci];
 var h='<div class="centre summary"><p class="sc">The record of '+esc(S.name)+'</p><p class="chosen">'+esc(personName())+'</p>';
 h+='<p><span>I.</span> '+esc(txt(c.intro))+'</p>';
 for(var i=2;i<=5;i++) h+='<p><span>'+ROMAN[i]+'.</span> '+esc(S.rounds[i].text)+'</p>';
 h+='<div class="foot"><p class="note">'+(storageOK?'This record has been saved to the class log.':'<span class="warn">This browser is not saving the log. Download the results from the first screen before closing the page.</span>')+'</p><button class="btn" id="next">Next student</button></div></div>';
 app.innerHTML=h;
 var b=document.getElementById("next"); b.focus();
 b.onclick=function(){screen="home";render();};
}

/* ---------- log ---------- */
var COLS=["name","character","nation","r1_roll","override","r2_choice","r2_roll","r2_outcome","r3_choice","r3_roll","r3_outcome","r4_choice","r4_roll","r4_outcome","r5_choice","r5_roll","r5_outcome","r5_rule","time"];
function stamp(){var t=new Date();function p(n){return (n<10?"0":"")+n;}return t.getFullYear()+"-"+p(t.getMonth()+1)+"-"+p(t.getDate());}
function download(name,type,data){
 var a=document.createElement("a"), url=URL.createObjectURL(new Blob([data],{type:type}));
 a.href=url;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);
 setTimeout(function(){URL.revokeObjectURL(url);},1000);
}
function downloadCSV(){
 var log=loadLog(), rows=[COLS.join(",")];
 log.forEach(function(r){rows.push(COLS.map(function(k){var v=r[k]==null?"":String(r[k]);return '"'+v.replace(/"/g,'""')+'"';}).join(","));});
 download("cotton-journey-results-"+stamp()+".csv","text/csv;charset=utf-8","﻿"+rows.join("\r\n"));
}
function downloadJSON(){download("cotton-journey-results-"+stamp()+".json","application/json",JSON.stringify(loadLog(),null,2));}

var hideNames=false;
function logScreen(){
 setRound("");
 var log=loadLog();
 var order=log.map(function(r,i){return {r:r,i:i};}).sort(function(a,b){
  var x=CHARS.map(function(c){return c.name;}); return x.indexOf(a.r.character)-x.indexOf(b.r.character);});
 var h='<div style="width:100%"><div class="noprint" style="display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.7rem"><button class="btn small" id="back">Back</button><button class="btn small" id="hn">'+(hideNames?'Show names':'Hide names')+'</button><button class="btn small" id="pr">Print this table</button></div>';
 if(!log.length) h+='<p class="big">No lives recorded yet.</p>';
 else{
  h+='<table><tr>'+(hideNames?'':'<th>Name</th>')+'<th>Character</th><th>II. Work</th><th>III. Market</th><th>IV. Luck</th><th>V. 1848</th><th class="noprint"></th></tr>';
  order.forEach(function(o){var r=o.r;
   h+='<tr>'+(hideNames?'':'<td>'+esc(r.name)+'</td>')+'<td>'+esc(r.character)+(r.nation?' ('+esc(r.nation)+')':'')+(r.override==="yes"?' *':'')+'</td>';
   for(var i=2;i<=5;i++) h+='<td><i>'+esc(r["r"+i+"_choice"])+'</i><br>'+(r["r"+i+"_roll"]===""?'':'['+r["r"+i+"_roll"]+'] ')+esc(r["r"+i+"_outcome"])+'</td>';
   h+='<td class="noprint"><button class="btn small rm" data-i="'+o.i+'">Remove</button></td></tr>';});
  h+='</table><p class="note" style="margin-top:.5rem">Italic lines are the student\'s choices. Numbers in brackets are rolls. * marks a character re-rolled by the teacher.</p>';
 }
 app.innerHTML=h+'</div>';
 document.getElementById("back").onclick=function(){screen="home";render();};
 document.getElementById("hn").onclick=function(){hideNames=!hideNames;render();};
 document.getElementById("pr").onclick=function(){window.print();};
 var rm=app.querySelectorAll(".rm");
 for(var j=0;j<rm.length;j++) rm[j].onclick=function(){
  var i=this.getAttribute("data-i");
  if(armed==="rm"+i){var l=loadLog();l.splice(+i,1);saveLog(l);render();}
  else{armed="rm"+i;this.textContent="Click again";}
 };
}

/* ---------- teacher override ---------- */
document.addEventListener("keydown",function(e){
 if(screen==="r1result"&&e.shiftKey&&(e.key==="R"||e.key==="r")){
  e.preventDefault(); var old=S.ci; var tries=0;
  do{rollCharacter();tries++;}while(S.ci===old&&tries<20);
  S.override=true; render();
 }
});

render();
</script>
</body>
</html>
